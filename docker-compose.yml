services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: policy-assistant-pgvector
    environment:
      POSTGRES_DB: policy_assistant
      POSTGRES_USER: policy_assistant
      POSTGRES_PASSWORD: policy_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
