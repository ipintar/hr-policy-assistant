spring.application.name=policy-assistant

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.url=jdbc:postgresql://localhost:5432/policy_assistant
spring.datasource.username=policy_assistant
spring.datasource.password=policy_assistant

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

policy.knowledge-base.path=classpath:policies/policy-knowledge-base.json

policy.rag.chunk-size=800
policy.rag.chunk-overlap=120
policy.rag.top-k=4
policy.rag.chat-model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
policy.rag.retrieval-strategy=pgvector-openai-rag
policy.rag.system-prompt=You are an HR policy assistant. Answer only from the provided policy context. Do not invent policies, benefits, or legal requirements that are not in the retrieved context. If the retrieved context is insufficient, say that you do not have enough policy information.
